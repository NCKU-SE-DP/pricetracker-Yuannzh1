name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'refactor/crawler-oop-implementation'
      - 'fix/integration-test'
      - 'refactor/llm_client'
      - 'refactor/llm-client-template-methods-pattern'


  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: F74136877

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3.12 -m pip install -r requirements.txt
          py3.12 pip install -r backend/requirements.txt
          py3.12 pip install pytest pytest-mock pytest-cov

      # - name: Run unit tests
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     cd backend
      #     pytest tests/unit --cov=src --cov-report=xml --disable-warnings

      - name: Run backend endpoints integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Run backend crawler module integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          pytest tests/unit --cov=src --cov-report=xml --disable-warnings
          
      - name: Run backend llm_client module integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          pytest tests/llm_client --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

